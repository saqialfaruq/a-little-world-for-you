<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>A Little World for You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
</head>
<body class="intro">
<div class="paper" aria-hidden="true"></div>

<div class="lock" id="lock" role="timer" aria-label="Hitung mundur menuju ulang tahun">
  <h2 data-bind="lockTitle"></h2>
  <p data-bind="lockText"></p>
  <div class="cd">
    <div><b id="cd-d">0</b><small>hari</small></div>
    <div><b id="cd-h">00</b><small>jam</small></div>
    <div><b id="cd-m">00</b><small>menit</small></div>
    <div><b id="cd-s">00</b><small>detik</small></div>
  </div>
  <p class="hand" data-bind="lockHand"></p>
</div>

<main id="stage">
  <!-- 1. WELCOME -->
  <section class="screen" id="welcome" data-gate>
    <h1 data-bind="title"></h1>
    <p class="hand" data-bind="tagline"></p>
    <button class="envelope" id="envelope" aria-label="Buka amplop">
      <span class="env-back"></span>
      <span class="env-card"><em>Untuk <span data-bind="to"></span></em></span>
      <span class="env-front"></span>
      <span class="env-flap"></span>
      <span class="seal">&hearts;</span>
    </button>
    <p class="hint" data-bind="hint"></p>
  </section>

  <!-- 2. BIRTHDAY -->
  <section class="screen" id="birthday" data-gate>
    <h2 data-bind="birthdayTitle"></h2>
    <svg class="cake" viewBox="0 0 240 230" role="group" aria-label="Kue ulang tahun dengan tiga lilin">
      <ellipse cx="120" cy="208" rx="108" ry="13" fill="#D9CCEB"/>
      <rect x="36" y="140" width="168" height="66" rx="16" fill="#D9CCEB"/>
      <rect x="54" y="98" width="132" height="50" rx="14" fill="#F6D5DA"/>
      <path d="M54 112c10 12 18 12 24 0 8 14 16 14 24 0 8 14 16 14 24 0 8 14 16 14 24 0 6 10 12 10 18 0v-6H54z" fill="#FBF5EC"/>
      <path d="M40 158c12 12 20 12 28 0 9 14 19 14 28 0 9 14 19 14 28 0 9 14 19 14 28 0 9 14 18 14 28 0" fill="none" stroke="#FBF5EC" stroke-width="9" stroke-linecap="round"/>
      <g fill="#B7C4A8"><ellipse cx="62" cy="188" rx="10" ry="5" transform="rotate(-20 62 188)"/><ellipse cx="178" cy="188" rx="10" ry="5" transform="rotate(20 178 188)"/></g>
      <circle cx="120" cy="190" r="7" fill="#C98B97"/>
      <g class="candle" tabindex="0" role="button" aria-label="Lilin 1"><rect x="76" y="40" width="28" height="62" fill="transparent"/><rect x="86" y="62" width="8" height="38" rx="3" fill="#C98B97"/><ellipse class="flame" cx="90" cy="52" rx="6" ry="10"/></g>
      <g class="candle" tabindex="0" role="button" aria-label="Lilin 2"><rect x="106" y="40" width="28" height="62" fill="transparent"/><rect x="116" y="62" width="8" height="38" rx="3" fill="#B7C4A8"/><ellipse class="flame" cx="120" cy="52" rx="6" ry="10"/></g>
      <g class="candle" tabindex="0" role="button" aria-label="Lilin 3"><rect x="136" y="40" width="28" height="62" fill="transparent"/><rect x="146" y="62" width="8" height="38" rx="3" fill="#C98B97"/><ellipse class="flame" cx="150" cy="52" rx="6" ry="10"/></g>
    </svg>
    <p id="b-text" data-bind="birthdayAsk"></p>
    <button class="btn" id="blow" data-bind="blowLabel"></button>
  </section>

  <!-- 3. GALLERY -->
  <section class="screen" id="gallery">
    <h2>Kenangan kecil</h2>
    <div class="stack" id="stack"></div>
    <p class="hint">Geser, lalu ketuk foto untuk membaca pesannya</p>
  </section>

  <!-- 4. LETTER -->
  <section class="screen" id="letter"><div class="sheet" id="sheet"></div></section>

  <!-- 5. BUCKET LIST -->
  <section class="screen" id="bucket">
    <h2>Kapan-kapan, kita&hellip;</h2>
    <ul class="list" id="bucketList"></ul>
    <form id="add"><input id="addIn" maxlength="60" placeholder="Tambah impian kita" aria-label="Tambah impian"><button class="btn">Tambah</button></form>
  </section>

  <!-- 6. LITTLE THINGS -->
  <section class="screen" id="things" data-gate>
    <h2>Hal-hal kecil</h2>
    <p id="count"></p>
    <div class="grid" id="cards"></div>
  </section>

  <!-- 7. FINAL -->
  <section class="screen" id="finale"><div id="fin"></div></section>
</main>

<button class="round" id="music" aria-pressed="false" aria-label="Musik">&#9834;</button>
<nav class="nav" aria-label="Navigasi">
  <button class="link" id="back">Kembali</button>
  <div id="dots" aria-hidden="true"></div>
  <button class="btn" id="next">Lanjut</button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js" defer></script>
<script src="data/content.js" defer></script>
<script src="js/main.js" defer></script>
<script src="js/sections/welcome.js" defer></script>
<script src="js/sections/birthday.js" defer></script>
<script src="js/sections/rest.js" defer></script>
<script src="js/countdown.js" defer></script>
</body>
</html>
